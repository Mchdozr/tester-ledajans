<script>
(function () {
  var play = document.getElementById("la1Play");
  var modal = document.getElementById("la1Modal");
  var frame = document.getElementById("la1Frame");
  var closeBtn = document.getElementById("la1Close");
  var yt = "https://www.youtube.com/embed/riOY6kz7cv4?autoplay=1";
  function openModal() {
    if (!modal) return;
    modal.hidden = false;
    modal.classList.add("is-open");
    if (frame) frame.src = yt;
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    if (!modal) return;
    modal.classList.remove("is-open");
    modal.hidden = true;
    if (frame) { frame.src = "about:blank"; frame.removeAttribute("src"); }
    document.body.style.overflow = "";
  }
  if (play) play.addEventListener("click", function (e) { e.preventDefault(); openModal(); });
  if (closeBtn) closeBtn.addEventListener("click", closeModal);
  if (modal) modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
})();
</script>
