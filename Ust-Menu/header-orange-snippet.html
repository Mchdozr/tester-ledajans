<script id="ledajans-logo-swap">
(function () {
  var HEADER = 'https://tester.ledajans.com/wp-content/uploads/2026/09/ledajans-ust-menu-logo.webp';
  var FOOTER = 'https://tester.ledajans.com/wp-content/uploads/2022/12/LedajansLogo.png';
  var re = /LedajansLogo|ledajans-logo|leadajans-logo/i;
  function apply() {
    document.querySelectorAll(".elementor-element-123bc72 .site-branding-logo img, .logo-mm img").forEach(function (img) {
      if ((img.getAttribute("src") || "") !== HEADER) {
        img.setAttribute("src", HEADER);
        img.setAttribute("data-src", HEADER);
      }
    });
    document.querySelectorAll("img.ledajans-footer-logo").forEach(function (img) {
      img.setAttribute("src", FOOTER);
      img.setAttribute("data-src", FOOTER);
    });
    document.querySelectorAll("img").forEach(function (img) {
      if (img.classList.contains("ledajans-footer-logo") || img.closest(".ledajans-footer")) return;
      if (img.closest(".elementor-element-123bc72 .site-branding-logo, .logo-mm")) return;
      var s = img.getAttribute("src") || "";
      var hit = re.test(s) || img.closest(".gsc-logo");
      if (hit && s !== HEADER) {
        img.setAttribute("src", HEADER);
        img.setAttribute("data-src", HEADER);
      }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", apply);
  else apply();
})();
</script>

<script id="ledajans-header-identity-js">
(function () {
  function dropThemeCanvas() {
    document.querySelectorAll(".wrapper-page > .canvas-mobile, .wrapper-page > #gva-overlay").forEach(function (el) {
      el.remove();
    });
  }
  function lockTrLabels() {
    var lang = (document.documentElement.lang || "").toLowerCase();
    var turkish = lang === "tr" || lang.indexOf("tr-") === 0;
    if (turkish) {
      var map = {
        "Contact Us": "İletişim",
        Kontakt: "İletişim",
        Contact: "İletişim",
        Home: "Anasayfa",
        Startseite: "Anasayfa"
      };
      document.querySelectorAll(
        "#menu-anamenu-desktop .menu-title, .elementor-element-123bc72 .gva-main-menu > li > a .menu-title"
      ).forEach(function (el) {
        var t = (el.textContent || "").trim();
        if (map[t]) el.textContent = map[t];
      });
    }
    document.querySelectorAll("header.wp-site-header, #menu-anamenu-desktop").forEach(function (el) {
      el.setAttribute("translate", "no");
    });
  }
  function run() {
    dropThemeCanvas();
    lockTrLabels();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
})();
</script>
<script id="ledajans-header-fit">
/* LEDAJANS-Header-Lang/2.0 — safety net. Language CSS is the layout. */
(function () {
  var FLOOR = 12;
  function fit() {
    if (window.innerWidth < 1025) return;
    var bar = document.querySelector(".elementor-element-123bc72");
    var menu = document.getElementById("menu-anamenu-desktop");
    var phones = document.querySelector(".elementor-element-123bc72 .ledajans-header-phones");
    var logo = document.querySelector(".elementor-element-123bc72 .site-branding-logo img");
    if (!bar || !menu || !phones || !logo) return;
    bar.style.removeProperty("--ldj-menu-size");
    bar.style.removeProperty("--ldj-menu-track");
    var title = menu.querySelector(".menu-title");
    var size = parseFloat(getComputedStyle(title || menu).fontSize) || 14.4;
    function collides() {
      var items = menu.querySelectorAll(":scope > li");
      if (!items.length) return false;
      var first = items[0].getBoundingClientRect();
      var last = items[items.length - 1].getBoundingClientRect();
      var logoR = logo.getBoundingClientRect().right;
      var phoneL = phones.getBoundingClientRect().left;
      if (!(logoR + 8 < first.left)) return true;
      if (!(last.right + 8 < phoneL)) return true;
      for (var i = 0; i < items.length - 1; i++) {
        var a = items[i].getBoundingClientRect();
        var b = items[i + 1].getBoundingClientRect();
        if (a.right > b.left - 1) return true;
      }
      return false;
    }
    var guard = 0;
    while (collides() && size > FLOOR && guard < 16) {
      size = Math.max(FLOOR, Math.round((size - 0.4) * 10) / 10);
      bar.style.setProperty("--ldj-menu-size", size + "px");
      guard += 1;
    }
    if (collides()) bar.style.setProperty("--ldj-menu-track", "-0.03em");
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fit);
  else fit();
})();
</script>
